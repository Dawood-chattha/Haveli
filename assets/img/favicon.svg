<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- HAVELI monogram: an H drawn on the same 20-44 box, at the same stroke
       weight, as the mark it replaces, so the tab icon keeps its density. -->
