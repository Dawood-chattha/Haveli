<!DOCTYPE html>
<html lang="en">
<head>
<!-- Asset paths below are relative; this resolves them from the site root so
     a deep route such as /category/women/ready-to-wear still finds them.

     It has to be a real tag, not one appended by script: the browser's
     preload scanner starts fetching resources before any script runs, and
     would request them against the current directory and 404.

     The consequence is that the site must be served over http — run
     dev/serve.ps1 rather than opening index.html from the file system. -->
<base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030302">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

<title>HAVELI — Real Fashion, Real Prices</title>
<meta name="description" content="Ready to wear, unstitched, western and kids clothing. Real fashion at real prices.">

<!-- Roboto is the family the reference storefront uses throughout. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<!-- Foundation -->
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">

<!-- Components -->
<link rel="stylesheet" href="assets/css/components/header.css">
<link rel="stylesheet" href="assets/css/components/menu-drawer.css">
<link rel="stylesheet" href="assets/css/components/hero.css">
<link rel="stylesheet" href="assets/css/components/collection-carousel.css">
<link rel="stylesheet" href="assets/css/components/product-card.css">
<link rel="stylesheet" href="assets/css/components/rail-section.css">
<link rel="stylesheet" href="assets/css/components/facets.css">
<link rel="stylesheet" href="assets/css/components/product-detail.css">
<link rel="stylesheet" href="assets/css/components/page.css">
<link rel="stylesheet" href="assets/css/components/checkout.css">
<link rel="stylesheet" href="assets/css/components/editorial.css">
<link rel="stylesheet" href="assets/css/components/footer.css">
</head>

<body class="page">

<a class="skip-link" href="#main">Skip to content</a>

<!-- =====================================================================
     HEADER — persists across route changes, so it is outside #app.
     Floating frosted bar: sticky wrapper of zero height, the bar itself
     absolutely placed 10px from the top. Never gains a background and
     never changes on scroll — matching the reference exactly.
     ===================================================================== -->
<header class="header">
  <div class="header__bar">
    <div class="header__columns">

      <div class="header__column header__column--left">
        <button class="hamburger" type="button"
                data-panel-open="menu"
                aria-expanded="false"
                aria-controls="menu-drawer"
                aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>

        <button class="header__action header__search--mobile" type="button"
                data-panel-open="search" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>
      </div>

      <div class="header__column header__column--center">
        <a class="header__logo" href="/" aria-label="Haveli home">HAVELI</a>
      </div>

      <div class="header__column header__column--right">
        <button class="header__action header__search--desktop" type="button"
                data-panel-open="search" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>

        <button class="header__action" type="button"
                data-panel-open="account" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="8" r="4"/></svg>
        </button>

        <!-- Saving a product had nowhere to show. The heart on a card filled
             in and nothing else on the page changed: there was no count, no
             icon, and the only routes to /wishlist were inside the account
             panel and down in the footer. So a saved item existed and was
             invisible, which reads as the feature not working.

             A link rather than a panel button, because unlike the cart there
             is a whole page for this and no useful summary to put in a
             drawer. The count is the same component the cart badge uses and
             behaves the same way, so the two read as one idea. -->
        <a class="header__action" href="/wishlist" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C7 17 3.5 14 3.5 10.2A4.2 4.2 0 0 1 12 7.7a4.2 4.2 0 0 1 8.5 2.5c0 3.8-3.5 6.8-8.5 10.3Z"/></svg>
          <span class="header__count" id="wish-count" aria-hidden="true">0</span>
          <span class="visually-hidden" id="wish-count-label">Items saved: 0</span>
        </a>

        <button class="header__action" type="button"
                data-panel-open="cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="header__count" id="cart-count" aria-hidden="true">0</span>
          <span class="visually-hidden" id="cart-count-label">Total items in cart: 0</span>
        </button>
      </div>

    </div>
  </div>
</header>

<!-- Shared dim behind every panel -->
<div class="overlay" id="overlay"></div>

<!-- =====================================================================
     NAV DRAWER — the only navigation, on desktop as well as mobile
     ===================================================================== -->
<aside class="panel panel--left" id="menu-drawer" data-panel="menu"
       aria-hidden="true" aria-label="Main menu">

  <div class="panel__head">
    <span class="panel__title">Menu</span>
    <button class="panel__close" type="button" data-panel-close aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="nav-tabs" id="nav-tabs" role="tablist" aria-label="Departments">
    <!-- tab buttons injected by header.js -->
    <span class="nav-tabs__ink" id="nav-tabs-ink" aria-hidden="true"></span>
  </div>

  <div class="panel__body">
    <div class="nav-view nav-view--root" id="nav-root"></div>
    <div class="nav-view nav-view--sub" id="nav-sub"></div>
  </div>

  <div class="panel__foot">
    <div class="nav-utils" id="nav-utils"></div>
  </div>

</aside>

<!-- =====================================================================
     ACCOUNT PANEL

     Two states, and assets/js/account-panel.js decides which is shown:
     a sign-in form for a visitor, and who you are for somebody already
     signed in. Both are in the markup so the panel is complete before a
     single script has run, and neither is drawn from a template string
     assembled in JavaScript.

     It used to be one state — a form with onsubmit="return false" and a
     note admitting it signed nobody in — which meant a customer who had
     already signed in opened this and was asked to sign in again.
     ===================================================================== -->
<aside class="panel panel--right" id="account-panel" data-panel="account"
       aria-hidden="true" aria-label="Account">

  <div class="panel__head">
    <span class="panel__title">Account</span>
    <button class="panel__close" type="button" data-panel-close aria-label="Close account panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- Signed out -->
  <div data-account-out hidden>
    <form class="panel__form" id="account-panel-form" novalidate>
      <label class="visually-hidden" for="account-panel-email">Email</label>
      <input class="field" id="account-panel-email" name="email" type="email"
             placeholder="Email" autocomplete="email" required data-panel-autofocus>

      <label class="visually-hidden" for="account-panel-password">Password</label>
      <input class="field" id="account-panel-password" name="password" type="password"
             placeholder="Password" autocomplete="current-password" required>

      <button class="btn btn--primary btn--block" type="submit">Sign in</button>
      <p class="panel__error" role="alert" data-account-error hidden></p>
    </form>

    <p class="panel__aside">
      Don’t have an account?
      <a href="/account?register=1" data-account-register>Register</a>
    </p>

    <!-- The same errand as the one on the account page, and the same route.
         A drawer is a bad place to read an email in, so this is a plain link
         out to the full page rather than a third state for this panel. -->
    <p class="panel__aside">
      <a href="/reset-password">Forgot your password?</a>
    </p>

    <div class="panel__links">
      <a href="/wishlist">Wishlist</a>
    </div>
  </div>

  <!-- Signed in -->
  <div data-account-in hidden>
    <p class="panel__who">
      Signed in as <strong data-account-email></strong>
    </p>

    <div class="panel__links">
      <a href="/account">Your orders</a>
      <a href="/wishlist">Wishlist</a>
    </div>

    <button class="btn btn--block" type="button" data-account-signout>Sign out</button>
  </div>

</aside>

<!-- =====================================================================
     CART PANEL — the cart page at /cart holds the full view
     ===================================================================== -->
<aside class="panel panel--right" id="cart-panel" data-panel="cart"
       aria-hidden="true" aria-label="Cart">

  <div class="panel__head">
    <span class="panel__title">Cart</span>
    <button class="panel__close" type="button" data-panel-close aria-label="Close cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="panel__empty" id="cart-panel-body">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
    <p>Your cart is empty</p>
    <a class="btn btn--primary" href="/">Continue shopping</a>
  </div>

  <div class="panel__links">
    <a href="/cart">View cart</a>
  </div>

</aside>

<!-- =====================================================================
     SEARCH MODAL — submitting navigates to /search?q=...
     ===================================================================== -->
<div class="search-modal" id="search-modal" data-panel="search"
     aria-hidden="true" role="dialog" aria-label="Search">

  <div class="search-modal__inner">
    <form class="search-modal__form" id="search-form">
      <button class="search-modal__submit" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <input class="search-modal__input" id="search-input" type="search"
             placeholder="Search for products" data-panel-autofocus>
      <button class="search-modal__dismiss" type="button" data-panel-close aria-label="Close search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </form>

    <p class="search-modal__hint">Popular right now</p>
    <div class="search-chips" id="search-chips">
      <button class="search-chip" type="button">Kaftan</button>
      <button class="search-chip" type="button">Essential Pret</button>
      <button class="search-chip" type="button">Unstitched</button>
      <button class="search-chip" type="button">Kurta Dupatta</button>
      <button class="search-chip" type="button">Chikankari</button>
      <button class="search-chip" type="button">Polo Shirts</button>
    </div>

    <div class="search-results" id="search-results" role="listbox" aria-label="Search suggestions" hidden></div>
  </div>

</div>

<!-- =====================================================================
     ROUTE OUTLET — every page renders in here
     ===================================================================== -->
<main class="page__main" id="main">
  <div id="app"></div>
</main>

<!-- =====================================================================
     FOOTER — outside #app so it persists across route changes
     ===================================================================== -->
<footer class="footer" id="site-footer"></footer>

<!-- Core -->
<script src="assets/js/main.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/ui.js"></script>

<!-- Asks the server who this visitor is, once, at boot. The session lives in
     a cookie the page cannot read, so this is the only way to know. Nothing
     here holds a token; see assets/js/auth.js. -->
<script src="assets/js/auth.js"></script>

<!-- The shop structure, as files -->
<!-- data/navigation.js is the menu's structure, and is the fallback the
     drawer keeps when /api/categories cannot be reached — a stale menu is
     still a menu. data/footer.js is which links the footer has and where they
     go, which is the shop's genuine shape.

     THE OTHER FIVE ARE NOT LOADED ANY MORE, AND THAT IS THE POINT
     hero.js, collections.js and editorial.js held invented marketing copy —
     seven headlines, ten tile names, and a row of figures claiming a hundred
     and twenty stores and a 4.6 rating. All of it was written to build the
     interface against, none of it could be reached by the shop's owner, and a
     customer reading it cannot tell it from fact. The first two now come from
     the banners table through /api/banners, which the owner edits in the
     panel; the figures have no honest source yet, so that row is not drawn.

     rails.js is the same kind of content — invented tile names and invented
     item counts — and has no owner-editable source yet either, so the rails
     are not drawn. catalogue.js is the generator for the placeholder
     catalogue; the storefront reads products from /api/catalogue and has not
     needed it since.

     All five stay in the repository. They are what the seed:demo command builds
     demo content from, which is exactly the separation they were always meant
     to have: structure in the database, invented contents behind a command
     that has to be asked for by name. -->
<script src="data/navigation.js"></script>
<script src="data/footer.js"></script>

<!-- Components -->
<script src="assets/js/header.js"></script>
<script src="assets/js/account-panel.js"></script>
<script src="assets/js/hero.js"></script>
<script src="assets/js/collections.js"></script>
<script src="assets/js/catalogue.js"></script>
<script src="assets/js/product-card.js"></script>
<script src="assets/js/rails.js"></script>
<script src="assets/js/facets.js"></script>
<script src="assets/js/footer.js"></script>

<!-- Pages -->
<script src="assets/js/pages/home.js"></script>
<script src="assets/js/pages/category.js"></script>
<script src="assets/js/pages/product.js"></script>
<script src="assets/js/pages/search.js"></script>
<script src="assets/js/pages/cart.js"></script>
<script src="assets/js/pages/checkout.js"></script>

</body>
</html>
